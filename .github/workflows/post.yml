name: Pubblica offerte su Telegram
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "run = pubblica la coda, check = verifica bot e canale (non posta)"
        default: "run"
permissions:
  contents: write
concurrency:
  group: post-queue
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Esegui
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.mode }}" = "check" ]; then python post.py check; else python post.py; fi
      - name: Salva stato coda
        run: |
          git config user.name "offerte-bot"
          git config user.email "offerte-bot@users.noreply.github.com"
          git add queue.csv
          git diff --cached --quiet || (git commit -m "coda aggiornata" && git pull --rebase -q && git push)
